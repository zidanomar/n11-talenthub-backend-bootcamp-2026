spring:
  cloud:
    config:
      enabled: false
  config:
    import: "optional:configserver:"
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: false

eureka:
  client:
    enabled: false

keycloak:
  server-url: http://localhost:8180
  realm: test-realm
  client:
    id: test-client
    secret: test-secret
  admin:
    username: admin
    password: admin
